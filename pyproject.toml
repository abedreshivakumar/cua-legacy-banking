[project]
name = "cua"
version = "0.1.0"
description = "Computer-use automation system: discover a legacy UI flow once with an LLM, replay it deterministically forever after."
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.75",
    "playwright>=1.48",
    "pydantic>=2.9",
    "typer>=0.15",
    "structlog>=24.4",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "jinja2>=3.1",
    "python-multipart>=0.0.12",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
]

[project.scripts]
cua = "cua.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "mypy>=1.13",
    "types-PyYAML>=6.0",
    # test-only: decoding a screenshot PNG to assert on actual pixel
    # values for the masked-region test (S13) — never imported by src/.
    "pillow>=10.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Typer's documented pattern is typer.Argument(...)/typer.Option(...) as
# parameter defaults — bugbear's "no function calls in defaults" doesn't
# know about Typer's special-casing of them.
"src/cua/cli.py" = ["B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"
